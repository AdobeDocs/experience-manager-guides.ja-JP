<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0B1829"/>
    <stop offset="100%" stop-color="#1C5296"/>
  </linearGradient>
</defs>

<!-- Background -->
<rect width="800" height="450" fill="url(#bg)"/>
<!-- AEM Guides red accent bar -->
<rect width="800" height="6" fill="#D4353C"/>

<!-- Decorative ambient circles -->
<circle cx="700" cy="55" r="160" fill="rgba(255,255,255,0.04)"/>
<circle cx="75" cy="415" r="105" fill="rgba(255,255,255,0.04)"/>

<!-- ── GIT COMMIT GRAPH ─────────────────────────────── -->
<!-- Main branch at y=235, nodes at x: 170, 290, 415 -->
<!-- Branch arc to y=150, node at x: 350 then merges back at 415 -->

<!-- Main branch connectors -->
<line x1="170" y1="235" x2="290" y2="235" stroke="rgba(255,255,255,0.38)" stroke-width="4.5"/>
<line x1="290" y1="235" x2="415" y2="235" stroke="rgba(255,255,255,0.38)" stroke-width="4.5"/>

<!-- Branch connectors -->
<line x1="290" y1="235" x2="350" y2="152" stroke="rgba(255,255,255,0.38)" stroke-width="4.5"/>
<line x1="350" y1="152" x2="415" y2="152" stroke="rgba(255,255,255,0.38)" stroke-width="4.5"/>
<line x1="415" y1="152" x2="415" y2="235" stroke="rgba(255,255,255,0.38)" stroke-width="4.5"/>

<!-- Main branch nodes -->
<circle cx="170" cy="235" r="26" fill="#2872C8" stroke="rgba(255,255,255,0.88)" stroke-width="3"/>
<circle cx="290" cy="235" r="26" fill="#2872C8" stroke="rgba(255,255,255,0.88)" stroke-width="3"/>
<circle cx="415" cy="235" r="26" fill="#2872C8" stroke="rgba(255,255,255,0.88)" stroke-width="3"/>

<!-- Branch nodes (lighter) -->
<circle cx="350" cy="152" r="20" fill="#6AB4FF" stroke="rgba(255,255,255,0.75)" stroke-width="2.5"/>
<circle cx="415" cy="152" r="20" fill="#6AB4FF" stroke="rgba(255,255,255,0.75)" stroke-width="2.5"/>

<!-- ── IMPORT ARROW ────────────────────────────────── -->
<line x1="448" y1="235" x2="510" y2="235" stroke="rgba(255,255,255,0.78)" stroke-width="4" stroke-dasharray="10,7"/>
<polygon points="508,223 532,235 508,247" fill="rgba(255,255,255,0.78)"/>

<!-- ── AEM DOCUMENT ICON ──────────────────────────── -->
<rect x="545" y="178" width="95" height="118" rx="5" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
<!-- Folded corner -->
<polygon points="590,178 640,178 640,205 590,205" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.42)" stroke-width="1.5"/>
<!-- Content lines -->
<line x1="558" y1="220" x2="627" y2="220" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
<line x1="558" y1="240" x2="627" y2="240" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
<line x1="558" y1="260" x2="610" y2="260" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
<line x1="558" y1="280" x2="622" y2="280" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
</svg>
